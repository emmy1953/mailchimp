<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="corner-logo" aria-hidden="true">
    <img src="./img/download.svg" alt="">
  </div>

  <div class="lang">
    <span aria-hidden="true"></span>
    <select aria-label="Language">
      <option>English</option>
      <option>Français</option>
      <option>Español</option>
    </select>
  </div>

  <div class="feedback">Feedback</div>

  <main class="card">
    <div class="brand">
      <img src="./img/download.svg" alt="">
    </div>
    <h1>Log in to Mailchimp</h1>
    <p class="signup">Need a Mailchimpan account? <a href="#">Create an account</a></p>

    <form>
      <label for="user">Username or Email</label>
      <input type="text" id="user" name="user" autocomplete="username">

      <button type="submit" class="btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        Log in
      </button>

      <div class="help">
        <a href="forgetusername.html">Forgot username?</a>
        <a href="reset.html">Forgot password?</a>
      </div>

      <hr>

      <p class="alt">Or, if you created your account with Google:</p>
      <button type="button" class="google">
        <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.7 2.3-7.7 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </form>
  </main>

</body>
</html>
