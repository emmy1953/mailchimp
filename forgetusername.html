<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover your Username</title>

    <link rel="stylesheet" href="forgetusername.css">
</head>
<body>

    <div class="page">

        <div class="recovery-box">

            <h1>Recover your<br>Username</h1>

            <p class="description">
                Having an identity crisis? You can recover your Mailchimp
                username using the email address or SMS number associated
                with your account.
            </p>

            <form>

                <!-- Email option -->
                <label class="option">
                    <input type="radio" name="recovery" checked>

                    <span class="radio-content">
                        Recover using the email address on your account
                    </span>
                </label>

                <input
                    type="email"
                    class="email-input"
                    placeholder="Ex: reddie@mailchimp.com"
                >

                <!-- Mobile option -->
                <label class="option mobile-option">
                    <input type="radio" name="recovery">

                    <span class="radio-content">
                        Recover using the mobile number on your account
                    </span>
                </label>

                <button type="submit" class="recover-btn">
                    Recover Username
                </button>

                <a href="index.html" class="login-link">
                    Return to login
                </a>

            </form>

        </div>

        <div class="language">
            <span></span>
            <span>English</span>
            <span class="arrow">⌄</span>
        </div>

        <div class="feedback">
            Feedback
        </div>

    </div>

</body>
</html>
